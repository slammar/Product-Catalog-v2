name: CI/CD Pipeline - ProductCatalog API
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
jobs:
# ====================================================================
# JOB 1 : Continuous Integration (Build & Unit Tests)
# ====================================================================
  unit-tests:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
# 1. Extraction du code source du dépôt
      - name: Checkout Repository
        uses: actions/checkout@v4
# 2. Configuration du SDK .NET
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # A Adapter selon votre .csproj
# 3. Restauration des dépendances NuGet de la solution
      - name: Restore dependencies
        run: dotnet restore src/ProductCatalog.Api/ProductCatalog.Api.csproj
# 4. Compilation de la solution en mode Release sans re-restaurer
      - name: Build solution
        run: dotnet build src/ProductCatalog.Api/ProductCatalog.Api.csproj --configuration Release --no-restore
      - name: Run Unit Tests
        run: >
          dotnet test tests/ProductCatalog.Tests/ProductCatalog.Tests.csproj 
          --filter "FullyQualifiedName~ProductUnitTests"
          --configuration Release
          --logger "console;verbosity=detailed"
# ==========================================================
# JOB 2 : Tests d'Intégration avec Service SQL Server
# ==========================================================
  integration-test:
    name: Integration Tests (SQL Server)
    runs-on: ubuntu-latest
    #needs: [unit-tests] # Condition : ne s'exécute QUE si le 1er Job a réussi !
# Le conteneur Docker n'est instancié QUE pour ce job
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
        - 1433:1433
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Password123!"
          options: >-
            --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P
            'Password123!' -C -Q 'SELECT 1'"
            --health-interval 15s
            --health-timeout 5s
            --health-retries 6
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # A Adapter
    - name: Restore dependencies
      run: dotnet restore src/ProductCatalog.Api/ProductCatalog.Api.csproj
    - name: Build solution
      run: dotnet build src/ProductCatalog.Api/ProductCatalog.Api.csproj --configuration Release --no-restore 
    - name: Run Integration Tests
      env:
        ConnectionStrings__CatalogDbConnection: "Server=localhost,1433;Database=CatalogDB_Test;User Id=sa;Password=Password123!;TrustServerCertificate=True;MultipleActiveResultSets=true"
      run: >
        dotnet test tests/ProductCatalog.Tests/ProductCatalog.Tests.csproj
        --no-build
        --configuration Release
        --logger "console;verbosity=detailed"
